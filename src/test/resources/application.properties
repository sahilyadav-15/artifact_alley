spring.datasource.url=jdbc:h2:mem:artifactalley-test;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
artifactalley.initial-admin-password=test-admin-password
artifactalley.auction.minimum-increment=100.00
artifactalley.auction.settlement-interval-ms=3600000
artifactalley.auction.settlement-initial-delay-ms=3600000
artifactalley.images.storage=local
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
