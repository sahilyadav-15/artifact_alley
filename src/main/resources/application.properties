spring.application.name=artifact-alley
spring.profiles.default=local
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
artifactalley.auction.minimum-increment=${AUCTION_MINIMUM_INCREMENT:100.00}
artifactalley.auction.settlement-interval-ms=${AUCTION_SETTLEMENT_INTERVAL_MS:60000}
artifactalley.auction.settlement-initial-delay-ms=${AUCTION_SETTLEMENT_INITIAL_DELAY_MS:60000}
artifactalley.auction.settlement-batch-size=${AUCTION_SETTLEMENT_BATCH_SIZE:50}
artifactalley.images.directory=${ARTIFACT_IMAGES_DIRECTORY:./uploads/artifacts}
artifactalley.images.storage=${ARTIFACT_IMAGE_STORAGE:local}
artifactalley.images.migration.enabled=false
artifactalley.security.login-max-attempts=${LOGIN_MAX_ATTEMPTS:5}
artifactalley.security.login-window-minutes=${LOGIN_WINDOW_MINUTES:15}
artifactalley.security.login-cleanup-interval-ms=${LOGIN_CLEANUP_INTERVAL_MS:3600000}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB
springdoc.packages-to-scan=com.artifactalley.api
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}
