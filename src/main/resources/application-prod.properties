spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.h2.console.enabled=false
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
artifactalley.initial-admin-password=${INITIAL_ADMIN_PASSWORD:}
artifactalley.base-url=${APP_BASE_URL}
artifactalley.images.storage=cloudinary
artifactalley.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
artifactalley.cloudinary.api-key=${CLOUDINARY_API_KEY}
artifactalley.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
artifactalley.cloudinary.connect-timeout=${CLOUDINARY_CONNECT_TIMEOUT:5s}
artifactalley.cloudinary.request-timeout=${CLOUDINARY_REQUEST_TIMEOUT:20s}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
